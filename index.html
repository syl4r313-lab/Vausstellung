<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>3D Ausstellungsraum</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #111; }
  canvas { display: block; }
  #info {
    position: absolute; top: 10px; left: 10px; color: #fff;
    font-family: sans-serif; font-size: 14px; background: rgba(0,0,0,0.5);
    padding: 8px 12px; border-radius: 6px; user-select: none; pointer-events: none;
  }
  #blocker {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.7); display: flex; align-items: center;
    justify-content: center; color: #fff; font-family: sans-serif;
    font-size: 20px; cursor: pointer; text-align: center;
  }
  #crosshair {
    position: absolute; top: 50%; left: 50%; width: 8px; height: 8px;
    margin: -4px 0 0 -4px; border: 2px solid #fff; border-radius: 50%;
    pointer-events: none; mix-blend-mode: difference;
  }
</style>
</head>
<body>
<div id="info">WASD: Bewegen | Maus: Umschauen | Klick auf ein Video: Ton an/aus | ESC: Maus freigeben</div>
<div id="crosshair"></div>
<div id="blocker"><div>Klicken, um den Raum zu betreten</div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

// ----- Grundlagen -----
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x202025);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 1.7, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ----- Licht -----
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 10, 5);
dirLight.castShadow = true;
scene.add(dirLight);

// ----- Raum -----
const ROOM_WIDTH = 20;
const ROOM_DEPTH = 20;
const ROOM_HEIGHT = 5;

const floorMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.9 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_WIDTH, ROOM_DEPTH), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_WIDTH, ROOM_DEPTH), new THREE.MeshStandardMaterial({ color: 0xeeeeee }));
ceiling.rotation.x = Math.PI / 2;
ceiling.position.y = ROOM_HEIGHT;
scene.add(ceiling);

const wallMat = new THREE.MeshStandardMaterial({ color: 0xdedede, roughness: 0.95 });
const partitionMat = new THREE.MeshStandardMaterial({ color: 0xc7c7c7, roughness: 0.95 });

function makeWall(width, height, position, rotationY) {
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(width, height), wallMat);
  wall.position.copy(position);
  wall.rotation.y = rotationY;
  wall.receiveShadow = true;
  scene.add(wall);
  return wall;
}

// Nord (hinten), Süd (vorne), Ost, West
makeWall(ROOM_WIDTH, ROOM_HEIGHT, new THREE.Vector3(0, ROOM_HEIGHT / 2, -ROOM_DEPTH / 2), 0);
makeWall(ROOM_WIDTH, ROOM_HEIGHT, new THREE.Vector3(0, ROOM_HEIGHT / 2, ROOM_DEPTH / 2), Math.PI);
makeWall(ROOM_DEPTH, ROOM_HEIGHT, new THREE.Vector3(-ROOM_WIDTH / 2, ROOM_HEIGHT / 2, 0), Math.PI / 2);
makeWall(ROOM_DEPTH, ROOM_HEIGHT, new THREE.Vector3(ROOM_WIDTH / 2, ROOM_HEIGHT / 2, 0), -Math.PI / 2);

// ----- Trennwände / Kollisionen -----
// Jede begehbare Trennwand wird als Box gebaut UND als Kollisions-Box gespeichert,
// damit man nicht hindurchlaufen kann (anders als beim Vorhang weiter unten).
const colliders = [];

function addPartitionWall(cx, cz, sizeX, sizeZ, height) {
  const geo = new THREE.BoxGeometry(sizeX, height, sizeZ);
  const mesh = new THREE.Mesh(geo, partitionMat);
  mesh.position.set(cx, height / 2, cz);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  colliders.push({
    minX: cx - sizeX / 2, maxX: cx + sizeX / 2,
    minZ: cz - sizeZ / 2, maxZ: cz + sizeZ / 2,
  });
}

// Eingangswand bei z=6 mit Lücke in der Mitte (x: -3 bis 3) als Durchgang,
// in dem der Vorhang hängt. Dahinter beginnt die eigentliche Ausstellungshalle.
const ENTRANCE_Z = 6;
const ENTRANCE_GAP_WIDTH = 6;
addPartitionWall(-6.5, ENTRANCE_Z, 7, 0.3, ROOM_HEIGHT);
addPartitionWall(6.5, ENTRANCE_Z, 7, 0.3, ROOM_HEIGHT);

// ----- Bilderrahmen mit Videos -----
// Liste deiner Videoquellen hier eintragen (Pfade oder URLs zu mp4-Dateien).
// Eine Station/Booth pro Video.
const videoSources = [
  'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4',
  'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/coffee.mp4',
  'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/friday.mp4',
  'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flame.mp4',
];

// Intro-Video, das auf dem schwarzen Vorhang am Eingang läuft.
const introVideoSrc = 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4';

const FRAME_WIDTH = 3;
const FRAME_HEIGHT = 1.8;
const FRAME_DEPTH = 0.1;
const FRAME_BORDER = 0.15;
const FRAME_Y = 2.3;

const videoElements = [];
const videoScreens = [];

function createVideoFrame(src) {
  const video = document.createElement('video');
  video.src = src;
  video.crossOrigin = 'anonymous';
  video.loop = true;
  video.muted = true;
  video.playsInline = true;
  video.addEventListener('error', () => {
    console.error('Video konnte nicht geladen werden:', src, video.error);
  });
  videoElements.push(video);

  const texture = new THREE.VideoTexture(video);
  texture.colorSpace = THREE.SRGBColorSpace;

  const group = new THREE.Group();

  // Rahmen (etwas größer, dunkles Holz)
  const frameGeo = new THREE.BoxGeometry(FRAME_WIDTH + FRAME_BORDER * 2, FRAME_HEIGHT + FRAME_BORDER * 2, FRAME_DEPTH);
  const frameMat = new THREE.MeshStandardMaterial({ color: 0x3b2a1a, roughness: 0.6 });
  const frameMesh = new THREE.Mesh(frameGeo, frameMat);
  frameMesh.castShadow = true;
  group.add(frameMesh);

  // Bildschirm/Video-Plane
  const screenGeo = new THREE.PlaneGeometry(FRAME_WIDTH, FRAME_HEIGHT);
  const screenMat = new THREE.MeshBasicMaterial({ map: texture });
  const screenMesh = new THREE.Mesh(screenGeo, screenMat);
  screenMesh.position.z = FRAME_DEPTH / 2 + 0.01;
  screenMesh.userData.video = video;
  group.add(screenMesh);
  videoScreens.push(screenMesh);

  return { group, video };
}

function placeFrame(src, position, rotationY) {
  const { group, video } = createVideoFrame(src);
  group.position.copy(position);
  group.rotation.y = rotationY;
  scene.add(group);
  return video;
}

// ----- Begehbare Stationen ("Raum im Raum") -----
// Jede Station ist ein U-förmiger Verschlag mit einer offenen Seite (openDir)
// und einem Videobild auf der Rückwand. openDir gibt an, auf welcher Seite
// der Eingang liegt: 'pz' = Eingang Richtung +z, 'nz' = Richtung -z,
// 'px' = Richtung +x, 'nx' = Richtung -x.
const BOOTH_SIZE = 5;
const BOOTH_HEIGHT = 4.2;
const BOOTH_WALL_THICKNESS = 0.3;

function createBooth(cx, cz, openDir, videoSrc) {
  const half = BOOTH_SIZE / 2;
  const minX = cx - half, maxX = cx + half;
  const minZ = cz - half, maxZ = cz + half;

  if (openDir !== 'nz') addPartitionWall(cx, minZ, BOOTH_SIZE, BOOTH_WALL_THICKNESS, BOOTH_HEIGHT);
  if (openDir !== 'pz') addPartitionWall(cx, maxZ, BOOTH_SIZE, BOOTH_WALL_THICKNESS, BOOTH_HEIGHT);
  if (openDir !== 'px') addPartitionWall(minX, cz, BOOTH_WALL_THICKNESS, BOOTH_SIZE, BOOTH_HEIGHT);
  if (openDir !== 'nx') addPartitionWall(maxX, cz, BOOTH_WALL_THICKNESS, BOOTH_SIZE, BOOTH_HEIGHT);

  let frameX = cx, frameZ = cz, rotY = 0;
  const inset = 0.12;
  switch (openDir) {
    case 'pz': frameZ = minZ + inset; rotY = 0; break;
    case 'nz': frameZ = maxZ - inset; rotY = Math.PI; break;
    case 'px': frameX = minX + inset; rotY = Math.PI / 2; break;
    case 'nx': frameX = maxX - inset; rotY = -Math.PI / 2; break;
  }

  placeFrame(videoSrc, new THREE.Vector3(frameX, FRAME_Y, frameZ), rotY);
}

// Zwei Stationen links, zwei rechts der Mittelachse, hinter dem Eingang.
createBooth(-6.5, -6, 'px', videoSources[0]);
createBooth(6.5, -6, 'nx', videoSources[1]);
createBooth(-6.5, 2, 'px', videoSources[2]);
createBooth(6.5, 2, 'nx', videoSources[3]);

// ----- Schwarzer Vorhang am Eingang mit Intro-Video -----
// Der Vorhang hängt genau in der Lücke der Eingangswand und ist absichtlich
// NICHT kollidierbar, damit man "durch" ihn hindurchlaufen kann.
function createCurtain(src, width, height, position) {
  const video = document.createElement('video');
  video.src = src;
  video.crossOrigin = 'anonymous';
  video.loop = true;
  video.muted = true;
  video.playsInline = true;
  video.addEventListener('error', () => {
    console.error('Intro-Video konnte nicht geladen werden:', src, video.error);
  });
  videoElements.push(video);

  const texture = new THREE.VideoTexture(video);
  texture.colorSpace = THREE.SRGBColorSpace;

  // Schwarzer Stoffrand um das Video, damit es wie ein Vorhang wirkt.
  const curtainGroup = new THREE.Group();
  const backingMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 1, side: THREE.DoubleSide });
  const backing = new THREE.Mesh(new THREE.PlaneGeometry(width, height), backingMat);
  curtainGroup.add(backing);

  const screenMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(width - 0.6, height - 0.6), screenMat);
  screen.position.z = 0.01;
  screen.userData.video = video;
  curtainGroup.add(screen);
  videoScreens.push(screen);

  curtainGroup.position.copy(position);
  scene.add(curtainGroup);
  return video;
}

createCurtain(introVideoSrc, ENTRANCE_GAP_WIDTH, ROOM_HEIGHT - 0.4, new THREE.Vector3(0, (ROOM_HEIGHT - 0.4) / 2, ENTRANCE_Z));

// ----- Wanddekoration: Frieden in vielen Sprachen, Symbole, Zitate -----
function createCanvasTexture(draw, width = 1024, height = 512) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  draw(ctx, width, height);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

function createPanel(draw, panelWidth, panelHeight, canvasWidth, canvasHeight) {
  const texture = createCanvasTexture(draw, canvasWidth, canvasHeight);
  const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(panelWidth, panelHeight), mat);
  return mesh;
}

function placeOnWall(mesh, x, y, z, rotationY) {
  mesh.position.set(x, y, z);
  mesh.rotation.y = rotationY;
  scene.add(mesh);
}

// "Frieden" in verschiedenen Sprachen
const peaceWords = [
  'Frieden', 'Peace', 'Paix', 'Paz', 'Pace', 'Mир', 'Vrede', 'Barış',
  '平和', '和平', 'سلام', 'שלום', 'Shanti', 'Ειρήνη', 'Fred', 'Rauha',
];

function drawPeaceWords(ctx, w, h) {
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(20,20,25,0.55)';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const cols = 4, rows = 4;
  const cellW = w / cols, cellH = h / rows;
  ctx.font = `bold ${Math.floor(cellH * 0.38)}px sans-serif`;
  peaceWords.forEach((word, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    ctx.fillText(word, cellW * col + cellW / 2, cellH * row + cellH / 2);
  });
}

// Friedenssymbole (Peace-Zeichen, Friedenstaube, Victory-Hand, Olivenzweig)
function drawPeaceSymbols(ctx, w, h) {
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(20,20,25,0.55)';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const symbols = ['☮', '🕊', '✌', '🌿'];
  const cellW = w / symbols.length;
  ctx.font = `${Math.floor(h * 0.55)}px sans-serif`;
  symbols.forEach((sym, i) => {
    ctx.fillText(sym, cellW * i + cellW / 2, h / 2);
  });
}

// Bekannte Zitate zum Thema Frieden
const peaceQuotes = [
  { text: '„Es gibt keinen Weg zum Frieden, der Friede ist der Weg.“', author: 'Mahatma Gandhi' },
  { text: '„Frieden bedeutet nicht die Abwesenheit von Konflikt, sondern die Fähigkeit, mit Konflikt umzugehen.“', author: 'Dorothy Thompson' },
  { text: '„Frieden kann nicht mit Gewalt erhalten werden, er kann nur durch Verständigung erreicht werden.“', author: 'Albert Einstein' },
  { text: '„Gib dem Frieden eine Chance.“', author: 'John Lennon' },
];

function drawQuote(ctx, w, h, quote) {
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(20,20,25,0.55)';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  function wrapText(text, maxWidth) {
    const words = text.split(' ');
    const lines = [];
    let line = '';
    for (const word of words) {
      const test = line ? line + ' ' + word : word;
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = word;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  ctx.font = `italic ${Math.floor(h * 0.09)}px serif`;
  const lines = wrapText(quote.text, w * 0.85);
  const lineHeight = h * 0.11;
  const startY = h / 2 - ((lines.length - 1) * lineHeight) / 2 - lineHeight * 0.4;
  lines.forEach((line, i) => ctx.fillText(line, w / 2, startY + i * lineHeight));

  ctx.font = `${Math.floor(h * 0.07)}px sans-serif`;
  ctx.fillText('– ' + quote.author, w / 2, startY + lines.length * lineHeight + lineHeight * 0.5);
}

// Panels an die Außenwände hängen
placeOnWall(createPanel(drawPeaceSymbols, 4, 2, 1024, 512), -8, 3.6, -ROOM_DEPTH / 2 + 0.02, 0);
placeOnWall(createPanel(drawPeaceWords, 5, 2.4, 1024, 512), 8, 3.5, -ROOM_DEPTH / 2 + 0.02, 0);
placeOnWall(createPanel((ctx, w, h) => drawQuote(ctx, w, h, peaceQuotes[0]), 5, 2, 1024, 420), 0, 3.6, -ROOM_DEPTH / 2 + 0.02, 0);

placeOnWall(createPanel((ctx, w, h) => drawQuote(ctx, w, h, peaceQuotes[1]), 5, 2, 1024, 420), -ROOM_WIDTH / 2 + 0.02, 3.6, -3, Math.PI / 2);
placeOnWall(createPanel(drawPeaceSymbols, 3, 1.6, 1024, 512), -ROOM_WIDTH / 2 + 0.02, 3.6, 3, Math.PI / 2);

placeOnWall(createPanel((ctx, w, h) => drawQuote(ctx, w, h, peaceQuotes[2]), 5, 2, 1024, 420), ROOM_WIDTH / 2 - 0.02, 3.6, -3, -Math.PI / 2);
placeOnWall(createPanel(drawPeaceWords, 4, 2, 1024, 512), ROOM_WIDTH / 2 - 0.02, 3.6, 3, -Math.PI / 2);

// Große Willkommens-Panels direkt an der Eingangswand (Lobby-Seite, vor dem Vorhang)
placeOnWall(createPanel(drawPeaceWords, 6, 2.8, 1024, 512), -6.5, 3.2, ENTRANCE_Z + 0.18, 0);
placeOnWall(createPanel((ctx, w, h) => drawQuote(ctx, w, h, peaceQuotes[3]), 6, 2.4, 1024, 420), 6.5, 3.2, ENTRANCE_Z + 0.18, 0);


const controls = new PointerLockControls(camera, document.body);
const blocker = document.getElementById('blocker');

blocker.addEventListener('click', () => {
  controls.lock();
  // Videos starten, sobald der Nutzer interagiert hat (Browser-Autoplay-Policy)
  videoElements.forEach(v => v.play().catch(() => {}));
});

controls.addEventListener('lock', () => { blocker.style.display = 'none'; });
controls.addEventListener('unlock', () => { blocker.style.display = 'flex'; });

// Klick auf ein Video schaltet dessen Ton an/aus (Fadenkreuz-Mitte als Zielpunkt)
const raycaster = new THREE.Raycaster();
document.addEventListener('click', () => {
  if (!controls.isLocked) return;
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
  const hit = raycaster.intersectObjects(videoScreens)[0];
  if (hit) {
    const video = hit.object.userData.video;
    video.muted = !video.muted;
    video.play().catch(() => {});
  }
});

scene.add(controls.getObject());

const move = { forward: false, backward: false, left: false, right: false };
const velocity = new THREE.Vector3();
const direction = new THREE.Vector3();

document.addEventListener('keydown', (e) => {
  switch (e.code) {
    case 'KeyW': case 'ArrowUp': move.forward = true; break;
    case 'KeyS': case 'ArrowDown': move.backward = true; break;
    case 'KeyA': case 'ArrowLeft': move.left = true; break;
    case 'KeyD': case 'ArrowRight': move.right = true; break;
  }
});

document.addEventListener('keyup', (e) => {
  switch (e.code) {
    case 'KeyW': case 'ArrowUp': move.forward = false; break;
    case 'KeyS': case 'ArrowDown': move.backward = false; break;
    case 'KeyA': case 'ArrowLeft': move.left = false; break;
    case 'KeyD': case 'ArrowRight': move.right = false; break;
  }
});

const MOVE_SPEED = 14.0;
const DAMPING = 6.0;
const PLAYER_RADIUS = 0.4;
const clock = new THREE.Clock();

function clampToRoom(position) {
  const limX = ROOM_WIDTH / 2 - PLAYER_RADIUS;
  const limZ = ROOM_DEPTH / 2 - PLAYER_RADIUS;
  position.x = Math.max(-limX, Math.min(limX, position.x));
  position.z = Math.max(-limZ, Math.min(limZ, position.z));
}

// Schiebt den Spieler aus Trennwänden heraus, falls er hineinläuft
// (Kreis-vs-AABB, jede Box vorher um den Spielerradius erweitert).
function resolveCollisions(position) {
  for (const c of colliders) {
    const minX = c.minX - PLAYER_RADIUS, maxX = c.maxX + PLAYER_RADIUS;
    const minZ = c.minZ - PLAYER_RADIUS, maxZ = c.maxZ + PLAYER_RADIUS;
    if (position.x <= minX || position.x >= maxX || position.z <= minZ || position.z >= maxZ) continue;

    const overlapXNeg = position.x - minX;
    const overlapXPos = maxX - position.x;
    const overlapZNeg = position.z - minZ;
    const overlapZPos = maxZ - position.z;
    const minOverlap = Math.min(overlapXNeg, overlapXPos, overlapZNeg, overlapZPos);

    if (minOverlap === overlapXNeg) position.x = minX;
    else if (minOverlap === overlapXPos) position.x = maxX;
    else if (minOverlap === overlapZNeg) position.z = minZ;
    else position.z = maxZ;
  }
}

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.1);

  velocity.x -= velocity.x * DAMPING * delta;
  velocity.z -= velocity.z * DAMPING * delta;

  direction.z = Number(move.forward) - Number(move.backward);
  direction.x = Number(move.right) - Number(move.left);
  direction.normalize();

  if (move.forward || move.backward) velocity.z -= direction.z * MOVE_SPEED * delta;
  if (move.left || move.right) velocity.x -= direction.x * MOVE_SPEED * delta;

  controls.moveRight(-velocity.x * delta);
  controls.moveForward(-velocity.z * delta);

  const playerPos = controls.getObject().position;
  clampToRoom(playerPos);
  resolveCollisions(playerPos);
  playerPos.y = 1.7;

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
